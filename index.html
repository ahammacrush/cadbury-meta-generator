<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadbury Meta Description Generator — moved</title>
    <!-- This tool has moved into the combined Cadbury catalogue/content
         app as its "Meta Generator" tab, alongside the Catalogue Audit
         tab — see PROJECT_CONTROL.md "Combined Product Roadmap" in
         ahammacrush/cadbury-website-auditor. This repo is no longer a
         second, independently maintained generator implementation; it
         only redirects here now. The ?product= query parameter (used to
         pre-fill a product name, e.g. from the audit workbook's
         hyperlinks) is preserved. -->
    <meta http-equiv="refresh" content="0; url=https://cadbury-website-auditor.vercel.app/meta-generator">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #5e3a8e 0%, #2d1b4e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        a { color: #fff; font-weight: 600; }
    </style>
    <script>
        (function redirectPreservingQuery() {
            var target = "https://cadbury-website-auditor.vercel.app/meta-generator" + window.location.search;
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <noscript>
        <p>This tool has moved. <a href="https://cadbury-website-auditor.vercel.app/meta-generator">Continue to the Meta Generator</a>.</p>
    </noscript>
    <p id="fallback" style="display:none">Redirecting to the Meta Generator&hellip; if nothing happens, <a href="https://cadbury-website-auditor.vercel.app/meta-generator">click here</a>.</p>
    <script>document.getElementById("fallback").style.display = "block";</script>
</body>
</html>
